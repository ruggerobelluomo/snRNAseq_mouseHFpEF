name: cellbender
channels:
  - conda-forge
dependencies:
  - python=3.10.21
  - pip
  - pytables=3.10.1
  - pip:
      - torch==2.8.0          # CUDA 12.8 build (needed for Blackwell GPUs, compute capability 12.0)
      - cellbender==0.4.0     # outputs identical to 0.3.2; checkpoints saved with dill (0.3.2 fails with torch >= 2); installs pyro-ppl 1.9.1, dill 0.4.1, anndata 0.11.4
